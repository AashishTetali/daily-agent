[project]
name = "daily-agent"
version = "0.1.0"
description = "Multi-agent personalized newspaper: world + science + AI news, MCP tools, guardrails, metrics"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "litellm>=1.50",
    "langgraph>=0.2",
    "langsmith>=0.1",
    "mcp>=1.2,<2",  # 1.x API (FastMCP). Version 2 renamed it, so stay on 1.x for tutorials to match
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "scikit-learn>=1.5",
    "tzdata",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.uv]
# This is an application, not a library: no build step, just install the dependencies.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test_app.py"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines are fine in a learning project
